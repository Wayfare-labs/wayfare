# Measure the corridors on a schedule and commit the result.
#
# This is the monitor running continuously without a host. The runner is the
# clock; wayfared -once performs exactly the sweep a deployed scheduler would,
# appends to the same hash-chained store, and exits.
#
# The history therefore lives in the repository, which is stronger evidence
# than a hosted instance in one respect: anyone can clone it and run
# `wayfared -verify-store -data ./data` to check that no past record was
# edited. Nobody has to trust a server they cannot inspect.
#
# The committed store is a bounded window, not the whole chain (ADR 007,
# issue #201). Each corridor keeps its newest 366 records — one calendar
# quarter at this cadence — and a chain that has outgrown the window is
# rotated down to the ceiling. Rotation re-seals the surviving records (their
# prev_hash chain restarts from the genesis hash), so the window still
# verifies; the dropped, older records remain in the repository's own git
# history, which is the archive this workflow commits to. Measurement data
# itself is never edited: only the two hash fields move.

name: measure

on:
  schedule:
    # Every six hours. Matches monitor.DefaultInterval — the corridors move on
    # the scale of days, so a shorter cadence would multiply load on a shared
    # public service for resolution nobody needs.
    - cron: "0 */6 * * *"
  workflow_dispatch:

# One sweep at a time. The store is append-only and chained, so two concurrent
# runs would race to extend the same chain and one would be rejected on the
# next open. Queue rather than cancel: a skipped measurement is a gap in the
# history, which is the thing this workflow exists to prevent.
concurrency:
  group: measure
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      # Base each run on the existing automation/measure branch when it exists
      # on origin, rebased onto the target branch, so consecutive scheduled runs
      # append to the pending chain rather than rebuilding from main and
      # discarding unmerged sweeps (#556). When automation/measure does not yet
      # exist on origin, create it from the checked-out target branch.
      - name: Prepare automation/measure branch
        run: |
          BASE_BRANCH="${GITHUB_REF_NAME:-main}"
          if git ls-remote --exit-code --heads origin automation/measure >/dev/null 2>&1; then
            git fetch origin automation/measure:refs/remotes/origin/automation/measure
            git checkout -B automation/measure origin/automation/measure
            git rebase "origin/${BASE_BRANCH}"
          else
            git checkout -B automation/measure "origin/${BASE_BRANCH}"
          fi

      # Verify that the restored/rebased store chain is intact before taking a
      # new sweep, so a broken pending branch fails loudly rather than appending
      # records on top of an invalid chain (#556).
      - name: Verify existing chain after rebase
        run: go run ./cmd/wayfared -verify-store -data ./data

      - name: Measure corridors
        run: go run ./cmd/wayfared -once -data ./data

      # After measuring, before verifying: a chain that has outgrown the
      # window ceiling is rotated down to the newest 366 records and the
      # surviving window is re-sealed so it still verifies. Dropped records
      # are not lost to the archive — they live in the repository's history,
      # which this workflow grows on every run.
      - name: Rotate chains over the window ceiling
        run: go run ./cmd/wayfared -rotate-store -data ./data

      # Before committing, not after. A chain that does not verify must never
      # reach the repository: appending to a broken one buries the break under
      # later valid records, and runstore.Open refuses to load it afterwards.
      - name: Verify the chain
        run: go run ./cmd/wayfared -verify-store -data ./data

      # Commit the new sweep directly onto automation/measure, verify the
      # committed store chain before pushing, push automation/measure
      # (preserving all prior unmerged sweep commits on the branch), and ensure
      # an open pull request exists against the base branch (#556).
      - name: Commit, verify, and push automation/measure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BASE_BRANCH="${GITHUB_REF_NAME:-main}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No store changes to commit"
            exit 0
          fi
          git commit -m "measure: corridor sweep ${{ github.run_id }}"
          go run ./cmd/wayfared -verify-store -data ./data
          git push --force-with-lease origin HEAD:automation/measure
          if ! gh pr view automation/measure --json number >/dev/null 2>&1; then
            gh pr create \
              --base "${BASE_BRANCH}" \
              --head automation/measure \
              --title "measure: corridor sweep ${{ github.run_id }}" \
              --body "$(printf 'Automated corridor measurement generated by the scheduled measure workflow.\n\nThe store was verified before this pull request was opened.')"
          fi
