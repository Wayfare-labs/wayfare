name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

  # A merge queue builds each candidate against the projected result of
  # everything ahead of it, and branch protection waits for these same four
  # contexts on that build. Without this trigger the checks never run for a
  # queued entry, so every pull request that enters the queue sits there until
  # it times out — the queue would look broken when it is simply unanswered.
  merge_group:
    branches: [main]

# A new push to a pull request makes the run of the previous head obsolete:
# both runs answer for a commit that is no longer the one under review, and
# the slower one would decide what the required checks report. A shared group
# lets the newer push cancel the older run instead of racing it (#574).
#
# The group is the pull request number for pull request events — every run of
# one PR shares it — and the ref for pushes to main and merge-queue entries,
# so runs on different branches never cancel each other.
concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

# The Go toolchain, in one place.
#
# It lived in three separate job definitions and drifted: 4a49804 meant to put
# 1.26 on the lint job so golangci-lint v2 would build, and landed it on
# "build and test" instead — so that job compiled and tested on 1.26 while lint
# and the offline tests stayed on 1.22, and lint passed on 1.22 regardless.
#
# A construct accepted by one toolchain and rejected by another would have
# shown up as a job disagreeing with its neighbours for reasons unrelated to
# the change under test. Defining it once removes that failure mode, and keeps
# CI honest about go.mod (go 1.27), the Dockerfile (golang:1.27-alpine) and
# the "Go 1.27+" README.md and CONTRIBUTING.md promise.
#
# Go 1.22 reached end of life and its standard library carried 22 HIGH/CRITICAL
# advisories (net/http and crypto/tls sit on the service's trust boundary;
# recorded rather than gated in SECURITY.md, measured 2026-09-25). Every fix is
# on the 1.24, 1.25, 1.26 or 1.27 release line — none on 1.22 — so the
# toolchain moves to a supported release in one place here (#564). This is a
# deliberate decision, not a quiet bump: #467 deliberately returned CI to 1.22,
# and staying there would keep carrying known-bad stdlib advisories.
env:
  GO_VERSION: "1.27.3"

jobs:
  build:
    name: build and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        timezone: [UTC, Pacific/Kiritimati, America/Adak]
    env:
      TZ: ${{ matrix.timezone }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test -race with coverage
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: go build
        run: go build ./...

  # No job goes without an explicit timeout (#573). GitHub's default ceiling is
  # six hours; these numbers come from observed durations on GitHub-hosted
  # runners, sampled across a week of runs, and leave headroom for a cold or
  # contended runner rather than being chosen at random.
  #
  # This job is a needs-gate: it runs a single `test` against needs.build's
  # aggregated result, and exits as soon as the matrix resolves — measured
  # check-run spans are 2–4s with a ~4s runner-scheduling tail, so the job is
  # bounded by the matrix above, whose slowest run finishes in under 10 minutes
  # (typical axes complete in <1; the worst observed is <3m under cold caches).
  # The floor of 1m covers the runner and steps alone; 10 matches the matrix's
  # own timeout, so the gate can never hold a finished branch open longer than
  # the work it is gating is known to take.
  build-and-test:
    name: build and test
    needs: build
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: require all timezone runs to pass
        run: test "${{ needs.build.result }}" = success

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      # Build from source with the configured Go toolchain: the prebuilt
      # golangci-lint binary is built with an older Go version and rejects
      # this module's Go 1.27.3 target.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          install-mode: goinstall

  # Every test is meant to run from recorded bytes. snapshot.Replayer returns
  # ErrNotRecorded rather than falling through to the network, so a test that
  # reaches out fails instead of passing intermittently — but that only holds
  # while nothing bypasses the replayer. This proves it structurally rather
  # than by convention.
  offline-tests:
    name: tests run with no network
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      # Only the modules need fetching. Compilation itself never touches the
      # network, so downloading is enough and is far cheaper than a full build.
      - name: download modules
        run: go mod download

      # The tests run in a network namespace with no route out, rather than
      # behind firewall rules.
      #

      # An earlier version blocked ports 80 and 443 with iptables on OUTPUT.
      # That also severs the Actions agent's own control connection to GitHub:
      # the runner stops reporting, the job hangs until the lost-communication
      # timeout, and no logs are ever uploaded. It failed after 45 minutes
      # without reaching a single test.
      #
      # Namespacing confines the blackout to the test process. Loopback is
      # brought up inside it because the tests stand up httpstervers on
      # 127.0.0.1 — tearing that down would fail them for a reason that has
      # nothing to do with egress.
      - name: run tests with no network
        run: |
          set -euo pipefail

          # Ubuntu 24.04 runners restrict unprivileged user namespaces through
          # AppArmor, so plain `unshare -rn` fails with EPERM on uid_map.
          # Lifting the restriction is preferable to running the tests under
          # sudo: as root the Go module and build caches resolve to a
          # different HOME, the warmed modules are missed, and the download
          # that follows is the very thing being blocked.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

          unshare -rn bash -c 'ip link set lo up 2>/dev/null; go test -count=3 -shuffle=on ./...'

      # Fuzz targets that only run by hand do not find regressions (#593).
      # Every target is discovered with `go test -list Fuzz` rather than a
      # hardcoded list, so a target added later is fuzzed without anyone
      # remembering to edit this file.
      #
      # Each target gets a short budget: enough to mutate its seed corpus
      # into new coverage many thousands of times, far too little to dominate
      # the job. The same blackout applies as to the tests above — a fuzzed
      # decoder has no more business reaching the network than a tested one,
      # and corpus mutation needs no egress either.
      - name: run fuzz targets with no network
        run: |
          set -euo pipefail
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

          unshare -rn bash -c '
            set -euo pipefail
            ip link set lo up 2>/dev/null || true
            ran=0
            for pkg in $(go list ./...); do
              for name in $(go test -list "^Fuzz" "$pkg" | grep "^Fuzz" || true); do
                echo "==> fuzzing $pkg.$name"
                go test "$pkg" -run "^$" -fuzz "^${name}\$" -fuzztime 20s
                ran=$((ran + 1))
              done
            done
            echo "fuzzed $ran target(s)"
          '

      # A fuzz run that finds a crash writes it under the target package's
      # testdata/fuzz/. Attach whatever it found to the run even when the
      # step above failed — a crasher that dies with the runner is a crasher
      # nobody can reproduce. Absence of crashers is the healthy case, so a
      # missing glob must not fail the upload (if-no-files-found: ignore).
      - name: upload fuzz crashers
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashers
          path: "**/testdata/fuzz/**"
          if-no-files-found: ignore

  # The image is how the monitor actually runs. Building it only at deploy
  # time means it breaks at the least convenient moment.
  docker:
    name: container image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: build image
        run: docker build -t wayfare:ci .

      - name: binary runs in the image
        run: docker run --rm wayfare:ci -verify-store -data /tmp/empty

      # The Dockerfile says what the image is made of; nothing in this
      # repository said whether any of it is known-bad. This is that
      # inspection, run against the image this job just built, so the gate and
      # the artifact can never be different artifacts.
      #
      # Both steps are pinned to a version and a scanner release, the rule the
      # lint job follows: a scanner that moved under us would silently change
      # what "passing" means.
      #
      # The report comes first because it never fails. It covers the whole
      # image — OS packages and language packages — which today means the Go
      # standard library compiled into /wayfared. On 2026-09-25 that scan
      # reported 22 HIGH/CRITICAL advisories with fixes, all in `stdlib` at Go
      # 1.22.12, and every fix is on a later release line (1.24.13+, 1.25.7+,
      # 1.26.0-rc.3+): not reachable without leaving the toolchain this
      # repository is pinned to. Those findings are real and are recorded here
      # rather than gated, because a job that is always red teaches people to
      # ignore it.
      - name: report known vulnerabilities in the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: image
          image-ref: wayfare:ci
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "0"

      # The gate covers what this repository can actually change: the packages
      # the base image ships. A finding here is always actionable — a newer
      # distroless tag — so the job never asks for a fix that does not exist.
      # Unfixed findings are excluded for the same reason: an advisory with no
      # available patch cannot be acted on, and failing on it would block every
      # pull request while announcing nothing new.
      - name: fail on a fixable vulnerability in the image's packages
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: image
          image-ref: wayfare:ci
          scanners: vuln
          vuln-type: os
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"

      # The scanner reports findings; an SBOM is the same inventory in a form a
      # downstream consumer can scan for themselves, against their own advisory
      # sources. It is emitted by the scanner the two steps above already use,
      # pinned to the same release, so the manifest describes the image this job
      # built and cannot drift from what was scanned.
      #
      # exit-code 0 because a report is not a gate: the gate is the step above.
      - name: generate an SBOM for the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: image
          image-ref: wayfare:ci
          format: cyclonedx
          output: wayfare.cyclonedx.json
          exit-code: "0"

      # Attached to the run so the SBOM outlives the workspace, which the
      # runner discards. A build that somehow produces no manifest fails here
      # rather than publishing an empty artifact.
      - name: upload the SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: wayfare.cyclonedx.json
          if-no-files-found: error
