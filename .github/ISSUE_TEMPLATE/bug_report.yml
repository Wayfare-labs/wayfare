name: Bug Report or UI Defect
description: Report a bug, UI rendering defect, or unexpected runtime failure.
title: ""
labels: ["area:ecosystem"]
body:
  - type: textarea
    id: what_happens
    attributes:
      label: What happens
      description: Describe the bug or unexpected behavior observed. Include code snippets or line references if known.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Observed / Reproduction
      description: Include exact commands run, environment/browser details, and raw terminal/console output.
      placeholder: "Observed against commit <hash> on <date>:\n\n```\n... command output ...\n```"
    validations:
      required: true

  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints that apply
      description: Check each box to confirm compliance with repository measurement constraints.
      options:
        - label: "assert nothing the repository does not currently support; check claims against the code as it is, not as it is described"
          required: true
        - label: "every measurement cited carries its source and the date it was checked"
          required: true
        - label: "mark future capabilities as future — do not describe roadmap items as though they are built"
          required: true
        - label: "a negative or inconclusive finding is a valid result and should be reported as one"
          required: true

  - type: textarea
    id: done_when
    attributes:
      label: Done when / Expected behavior
      description: Describe expected correct behavior and acceptance criteria for resolving the issue.
      placeholder: |
        - [ ] ...
    validations:
      required: true
