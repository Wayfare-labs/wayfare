# Re-run the accessibility audit (#273) on a schedule with the browser harness
# and fail on new violations (issue #751).

name: qa-accessibility

on:
  schedule:
    # Run nightly at 03:00 UTC
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.22"
  NODE_VERSION: "22"

jobs:
  accessibility:
    name: WCAG accessibility audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: docs/qa/browser/package-lock.json

      - name: install browser dependencies
        run: |
          cd docs/qa/browser
          npm ci
          npx playwright install --with-deps chromium

      - name: start test servers
        run: |
          ./docs/qa/browser/servers.sh start

      - name: run accessibility audit
        run: |
          cd docs/qa/browser
          npm run accessibility

      - name: run contrast audit
        run: |
          cd docs/qa/browser
          npm run contrast

      - name: stop test servers
        if: always()
        run: |
          ./docs/qa/browser/servers.sh stop

      - name: upload accessibility results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: accessibility-audit-results
          path: docs/qa/browser/results/accessibility.json
          if-no-files-found: ignore
