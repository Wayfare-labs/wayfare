# Source-level vulnerability scan.
#
# The container image scan (.github/workflows/ci.yml) reports what is in the
# built image; govulncheck reports which of those advisories are reachable
# from Wayfare's own code, which is the information needed to decide what is
# urgent. Runs on every pull request and on a weekly schedule.

name: govulncheck

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly, Monday morning.
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache: true
          cache-dependency-path: go.sum

      # govulncheck is pinned so the scanner cannot move under this
      # repository and quietly change what "reachable" means.
      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      - name: run govulncheck
        # govulncheck exits non-zero when a vulnerability reachable from
        # this code is found, so a reachable advisory fails this job.
        run: govulncheck ./...
