# Fly.io deployment for the Wayfare corridor monitor.
#
# Read docs/deployment.md before changing anything here. Two settings below are
# load-bearing rather than conventional, and both are commented at the point
# they appear: the region, and auto-stop.

app = "wayfare" # For staging, use a distinct app name (e.g. "wayfare-staging") and app-specific configuration if needed.

# Frankfurt. Fly egress is $0.02/GB in Europe and North America but $0.12/GB in
# Africa — six times the price for deploying near Lagos, with no benefit for a
# monitor whose readers are anywhere and whose upstreams (Horizon, the rate
# feeds) are not in Africa either. "ams" is an equally good choice.
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  WAYFARE_DATA_DIR = "/data"
  WAYFARE_LOG_LEVEL = "info"

[[mounts]]
  source = "wayfare_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true

  # THIS IS THE IMPORTANT ONE.
  #
  # Fly's auto-stop is correct for request-driven apps and fatal here: a
  # sleeping machine runs no scheduler, so the history would develop holes
  # exactly when nobody was watching — which is precisely when a corridor
  # breaking is most worth having recorded.
  #
  # It is the same failure the "scheduler is separable from HTTP" requirement
  # exists to prevent, arriving through infrastructure instead of through code.
  # Do not enable auto-stop to save a few dollars.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
